apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hr-uploads
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backend.uploadsStorage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql 3306; do echo "waiting for mysql"; sleep 2; done
      containers:
        - name: backend
          image: {{ .Values.dockerUser }}/hr-backend:{{ .Values.backendTag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/hr_admin?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
            - name: DB_USERNAME
              value: hr
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: JWT_SECRET
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: APP_FRONTEND_URL
              value: "{{ .Values.frontendUrl }}"
            - name: ASSISTANT_ENABLED
              value: "false"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: "none"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: "none"
            - name: APP_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: APP_BOOTSTRAP_ADMIN_USERNAME
                  optional: true
            - name: APP_BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: APP_BOOTSTRAP_ADMIN_EMAIL
                  optional: true
            - name: APP_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: APP_BOOTSTRAP_ADMIN_PASSWORD
                  optional: true
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: MAIL_USERNAME
                  optional: true
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: MAIL_PASSWORD
                  optional: true
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: hr-uploads
---
# Le Service doit s'appeler "backend" : c'est le nom utilisé par nginx (proxy_pass http://backend:8080)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
