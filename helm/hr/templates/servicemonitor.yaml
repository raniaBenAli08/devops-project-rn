{{- if .Values.monitoring.enabled }}
# Dit à Prometheus (kube-prometheus-stack, release "monitoring") de lire les métriques du backend
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hr-backend
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
{{- end }}
