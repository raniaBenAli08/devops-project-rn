spring:
  application:
    name: hr-admin-panel

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hr_admin}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

app:
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    demo-mode: ${ASSISTANT_DEMO_MODE:false}
    api-key: ${ASSISTANT_API_KEY:}
    endpoint: ${ASSISTANT_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${ASSISTANT_MODEL:gpt-4o-mini}
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVKd3RTZWNyZXRLZXlGb3JIckFkbWluUGFuZWw=}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
  bootstrap:
    admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  registration:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    verification-expiration-hours: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: hr-admin-panel
